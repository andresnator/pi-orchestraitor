# Pi supplies runtime peers; only the development host is installed here.
autoInstallPeers: false
minimumReleaseAge: 1440
# The maintainer admitted these exact Pi versions before their release age passed.
minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@1.3.0'
  - '@earendil-works/pi-ai@1.3.0'
  - '@earendil-works/pi-codemode@1.3.0'
  - '@earendil-works/pi-coding-agent@1.3.0'
  - '@earendil-works/pi-mcp@1.3.0'
  - '@earendil-works/pi-telemetry@1.3.0'
  - '@earendil-works/pi-tui@1.3.0'
blockExoticSubdeps: true
strictDepBuilds: true
# Published artifacts/platform packages are sufficient for the verified toolchain.
# New versions with build scripts require a fresh review.
allowBuilds:
  '@google/genai@2.21.0': false
  esbuild@0.28.2: false
  protobufjs@7.6.6: false
