name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / Pi 1.0.4
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24.20.0"]
    env:
      PI_OFFLINE: "1"
      PI_TELEMETRY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Install locked development host
        run: pnpm install --frozen-lockfile
      - name: Verify local Pi version
        run: pnpm exec pi --version
      - name: Run deterministic tests
        run: pnpm test
      - name: Check package inventory
        run: pnpm pack --dry-run --ignore-scripts
      - name: Check lockfile and policy stay unchanged
        run: git diff --exit-code -- pnpm-lock.yaml pnpm-workspace.yaml
      - name: Check whitespace
        run: git show --format= --check HEAD
